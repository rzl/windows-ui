<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monaco Editor</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #editor { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search)
      // 支持通过 ?cdn=/monaco-editor/min 指定本地或 CDN 根路径
      const cdn = (params.get('cdn') || '/monaco-editor/min').replace(/\/$/, '')

      function log(msg) {
        console.log('[MonacoEditor]', msg)
      }

      function report(type, data) {
        if (window.parent !== window) {
          window.parent.postMessage({ type, ...data }, '*')
        }
      }

      function loadCss(url) {
        const link = document.createElement('link')
        link.rel = 'stylesheet'
        link.href = url
        document.head.appendChild(link)
      }

      function initEditor(value, language, readOnly) {
        try {
          if (!window.monaco) {
            throw new Error('monaco 对象不存在')
          }
          const editor = monaco.editor.create(document.getElementById('editor'), {
            value: value || '',
            language: language || 'javascript',
            theme: 'vs',
            automaticLayout: true,
            minimap: { enabled: false },
            readOnly: !!readOnly,
            scrollBeyondLastLine: false,
            fontSize: 13,
            tabSize: 2
          })
          editor.onDidChangeModelContent(() => {
            report('change', { value: editor.getValue() })
          })
          report('ready', {})
        } catch (err) {
          document.body.innerHTML = '<div style="padding:20px;color:red">编辑器初始化失败: ' + (err?.message || String(err)) + '</div>'
          report('error', { message: '编辑器初始化失败: ' + (err?.message || String(err)) })
        }
      }

      window.MonacoEnvironment = {
        getWorkerUrl: function (_moduleId, label) {
          const map = {
            javascript: cdn + '/vs/assets/editor.worker-Be8ye1pW.js',
            typescript: cdn + '/vs/assets/ts.worker-CMbG-7ft.js',
            json: cdn + '/vs/assets/json.worker-DKiEKd88.js',
            css: cdn + '/vs/assets/css.worker-HnVq6Ewq.js',
            html: cdn + '/vs/assets/html.worker-B51mlPHg.js'
          }
          return map[label] || map.javascript
        }
      }

      loadCss(cdn + '/vs/editor/editor.main.css')

      const script = document.createElement('script')
      script.src = cdn + '/vs/loader.js'
      script.onload = function () {
        log('loader loaded from ' + cdn)
        window.require.config({ paths: { vs: cdn + '/vs' } })
        window.require(['vs/editor/editor.main'], function () {
          log('editor.main loaded')
          window.addEventListener('message', function (e) {
            const data = e.data || {}
            log('received: ' + data.type)
            if (data.type === 'init') {
              initEditor(data.value, data.language, data.readOnly)
            }
          })
          report('ready', {})
        }, function (err) {
          document.body.innerHTML = '<div style="padding:20px;color:red">Monaco 加载失败: ' + (err?.message || String(err)) + '</div>'
          report('error', { message: 'Monaco 加载失败: ' + (err?.message || String(err)) })
        })
      }
      script.onerror = function () {
        document.body.innerHTML = '<div style="padding:20px;color:red">Monaco loader 加载失败: ' + script.src + '</div>'
        report('error', { message: 'Monaco loader 加载失败: ' + script.src })
      }
      document.head.appendChild(script)

      window.onerror = function (message, source, lineno, colno, error) {
        report('error', { message: '运行时错误: ' + message, source, lineno, colno, stack: error?.stack })
      }
    })()
  </script>
</body>
</html>
