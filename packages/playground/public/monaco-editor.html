<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monaco Editor</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #container { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
  <script>
    let editor = null
    let language = 'javascript'
    let readOnly = false

    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' } })

    function initEditor(value) {
      require(['vs/editor/editor.main'], function () {
        if (editor) {
          editor.dispose()
        }
        editor = monaco.editor.create(document.getElementById('container'), {
          value: value || '',
          language: language,
          theme: 'vs',
          automaticLayout: true,
          minimap: { enabled: false },
          readOnly: readOnly
        })
        editor.onDidChangeModelContent(function () {
          window.parent.postMessage({ type: 'change', value: editor.getValue() }, '*')
        })
        window.parent.postMessage({ type: 'ready' }, '*')
      })
    }

    window.addEventListener('message', function (e) {
      const data = e.data || {}
      if (data.type === 'init') {
        language = data.language || 'javascript'
        readOnly = !!data.readOnly
        initEditor(data.value || '')
      } else if (data.type === 'setValue' && editor) {
        editor.setValue(data.value || '')
      } else if (data.type === 'setLanguage' && editor) {
        monaco.editor.setModelLanguage(editor.getModel(), data.language || 'javascript')
      }
    })

    window.onload = function () {
      window.parent.postMessage({ type: 'load' }, '*')
    }
  </script>
</body>
</html>
